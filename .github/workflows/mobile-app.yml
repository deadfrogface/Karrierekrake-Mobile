name: Mobile app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build for iOS (macOS runner, costs about 10x Linux minutes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: app tests (Toga test backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "toga-core~=0.5.0" "toga-dummy~=0.5.0" pytest keyring httpx pyyaml python-dotenv \
            "pypdf>=6.16.1" beautifulsoup4 python-dateutil requests certifi
      - name: Tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q -p no:cacheprovider tests_mobile -c /dev/null --rootdir tests_mobile

  android:
    name: Android app (APK)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Briefcase
        run: python -m pip install "briefcase==0.4.7"
      - name: Build
        run: |
          briefcase create android --no-input
          briefcase build android --no-input
      - uses: actions/upload-artifact@v4
        with:
          name: karrierekrake-android-debug
          path: build/**/*.apk
          retention-days: 7
          if-no-files-found: error

  ios:
    name: iOS app (simulator build)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Briefcase
        run: python -m pip install "briefcase==0.4.7"
      - name: Build
        run: |
          briefcase create iOS --no-input
          briefcase build iOS --no-input
